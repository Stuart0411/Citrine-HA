alias: Push EV site budget to CitrineOS bridge
description: Example Home Assistant automation posting desired policy to bridge
mode: single
trigger:
  - platform: time_pattern
    minutes: "/1"
action:
  - service: rest_command.citrineos_site_budget
    data:
      idempotency_key: "{{ now().strftime('%Y%m%d%H%M') }}"
      source_ts: "{{ now().isoformat() }}"
      ttl_seconds: 120
      site_budget_watts: "{{ states('input_number.ev_site_budget_watts') | int(11000) }}"

# Add this rest_command block in configuration.yaml:
