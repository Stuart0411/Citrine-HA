services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: citrineos-ha-load-management:latest
    container_name: citrineos-ha-load-management
    env_file:
      - .env
    ports:
      - "8095:8095"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8095/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  bridge-dev:
    image: node:20-alpine
    container_name: citrineos-ha-load-management-dev
    working_dir: /workspace
    command: sh -c "npm install && npm run dev"
    env_file:
      - .env
    ports:
      - "8096:8095"
    volumes:
      - ./:/workspace
      - /workspace/node_modules
    profiles:
      - dev
    init: true
    restart: unless-stopped
